# Blueprint do Render — https://render.com/docs/blueprint-spec
# Uso: Render Dashboard → New → Blueprint → selecione este repositório.
# Cria o serviço web com disco persistente para uploads. O banco é o Supabase.
# Na criação, o Render pede os valores marcados com `sync: false`.
#
# Preferiu o Postgres do próprio Render? Descomente o bloco abaixo e troque
# DATABASE_URL por:  fromDatabase: { name: eba-db, property: connectionString }
#
# databases:
#   - name: eba-db
#     databaseName: eba
#     user: eba
#     plan: basic-256mb
#     region: virginia
#     postgresMajorVersion: "16"

services:
  - type: web
    name: escola-biblica-atitude
    runtime: node
    region: virginia
    # Disco persistente e pre-deploy exigem plano pago (starter ou superior).
    plan: starter
    branch: main
    # As migrações rodam no build porque ele pré-renderiza páginas que leem o banco.
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build
    # Perfis, permissões e admin inicial (idempotente, não apaga dados).
    preDeployCommand: npm run db:bootstrap
    startCommand: npm start
    healthCheckPath: /robots.txt
    disk:
      name: storage
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase → Connect → "Session pooler" (porta 5432, host *.pooler.supabase.com), com ?connection_limit=5 no final.
      # Não use a conexão direta (só IPv6) nem o Transaction pooler (6543), que quebra as migrações.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /var/data/storage
      - key: UPLOAD_MAX_MB
        value: "200"
      # Sem domínio próprio, deixe em branco: usa a URL .onrender.com automaticamente.
      - key: APP_URL
        sync: false
      # Primeiro administrador, criado no pre-deploy. Remova ADMIN_PASSWORD após o primeiro acesso.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # E-mail — configure no painel do Render (Environment); o Blueprint não sobrescreve estes valores.
      #   EMAIL_PROVIDER: "log" (padrão: grava na caixa de saída, Admin › Logs, sem enviar), "resend" ou "smtp"
      #   EMAIL_FROM: remetente do domínio verificado, ex.: Escola Bíblica Atitude <nao-responda@ibatitude.com.br>
      #   RESEND_API_KEY (com "resend") ou SMTP_URL (com "smtp", ex.: smtps://usuario:senha@host:465)
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
